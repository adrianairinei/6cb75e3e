<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Fridge board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--gold:#ffd23f;--red:#ff3b3b}
html,body{margin:0;height:100%}
body{font-family:Oswald,"Arial Narrow",Impact,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;height:100vh;min-height:100vh;position:relative;overflow-x:hidden;
 background:repeating-linear-gradient(180deg,#1f8a3a 0 10vh,#23993f 10vh 20vh);}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco svg{width:100%;height:100%}
.deco .land{display:none}
header,main,footer{position:relative;z-index:1}
header{flex:none;margin:2vmin 3vmin 1vmin;padding:1.5vmin 3vmin;display:flex;justify-content:space-between;align-items:center;gap:1.5vmin;flex-wrap:wrap;
 background:linear-gradient(#141821,#05070b);border:.5vmin solid #3a4150;border-radius:1.5vmin;box-shadow:0 1vmin 2vmin rgba(0,0,0,.45)}
h1{margin:0;font-family:"Bebas Neue",Oswald,Impact,sans-serif;font-weight:400;font-size:max(40px,9vmin);letter-spacing:.3vmin;line-height:1;color:var(--gold);text-shadow:0 0 1.2vmin rgba(255,210,63,.6)}
h1 .ic{display:inline-block;margin-right:1.5vmin;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){h1 .ic,.live i{animation:none}}
#meta{font-family:"Courier New",monospace;font-weight:700;background:#000;color:#ff9f1c;border:.3vmin solid #333;border-radius:.8vmin;padding:1vmin 2vmin;font-size:max(16px,3vmin);letter-spacing:.2vmin}
#err{color:var(--red)}
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:1vmin 4vmin 2vmin;overflow-y:auto}
h2{flex:none;align-self:flex-start;margin:1vmin 0 2.5vmin;padding:.6vmin 3vmin;font-family:"Bebas Neue",Oswald,sans-serif;font-weight:400;font-size:max(28px,6vmin);letter-spacing:.2vmin;background:#fff;color:#0d4d1f;border-radius:.8vmin;transform:skew(-8deg);box-shadow:.8vmin .8vmin 0 rgba(0,0,0,.35)}
.grid{flex:1 1 auto;display:flex;flex-direction:column;gap:2.2vmin;margin-bottom:2vmin;min-height:0}
.card{flex:1 1 0;min-height:max(120px,14vmin);border-radius:2vmin;padding:2vmin 3vmin 2vmin 3.5vmin;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"num txt food";align-items:center;column-gap:3vmin;position:relative;overflow:hidden;
 background:linear-gradient(110deg,#1b2a4a,#0b1426);border:.5vmin solid rgba(255,255,255,.85);box-shadow:0 1.2vmin 0 rgba(0,0,0,.35)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:1.6vmin;background:var(--k,#3a86ff)}
.card .jn{grid-area:num;display:flex;flex-direction:column;align-items:center;gap:.5vmin}
.card .num{font-family:"Bebas Neue",Impact,sans-serif;font-size:max(60px,15vmin);line-height:.85;color:var(--k,#3a86ff);-webkit-text-stroke:.3vmin #fff;opacity:.95}
.card .day{font-size:max(28px,5vmin);line-height:1}
.card .txt{grid-area:txt;display:flex;flex-direction:column;gap:1vmin;min-width:0;align-items:flex-start;text-align:left}
.card .lbl{font-family:"Bebas Neue",Oswald,sans-serif;font-size:max(26px,5.5vmin);letter-spacing:.3vmin;color:#cfd8e6;line-height:1}
.card .val{font-weight:700;font-size:max(30px,6.5vmin);line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.card .food{grid-area:food;font-size:max(40px,10vmin)}
.card.today{border-color:var(--gold);transform:scale(1.02);box-shadow:0 0 0 .7vmin var(--gold),0 0 4vmin rgba(255,210,63,.7);padding-bottom:6vmin}
.card.today::after{content:"⚽ MATCH DAY";position:absolute;bottom:0;left:0;right:0;background:var(--red);color:#fff;font-family:"Bebas Neue",sans-serif;font-size:max(18px,3.6vmin);letter-spacing:.2vmin;padding:.4vmin 2vmin;text-align:center}
.live{position:absolute;top:1.5vmin;right:2.5vmin;font-family:"Bebas Neue",sans-serif;font-size:max(16px,3.4vmin);color:#fff;display:flex;align-items:center;gap:.8vmin}
.live i{width:1.8vmin;height:1.8vmin;border-radius:50%;background:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.badge{display:inline-block;background:var(--gold);color:#111;border-radius:.8vmin;padding:.4vmin 2vmin;font-size:max(26px,5vmin)}
.c0{--k:#e63946}.c1{--k:#3a86ff}.c2{--k:#ffbe0b}.c3{--k:#2ec4b6}.c4{--k:#ff6d00}.c5{--k:#9d4edd}.c6{--k:#06d6a0}
footer{flex:none;z-index:2;margin:0 3vmin 2vmin;padding:1.4vmin 3vmin;background:#000;color:var(--gold);font-size:max(16px,2.8vmin);font-weight:700;letter-spacing:.1vmin;text-align:center;border:.3vmin solid var(--gold);border-radius:1vmin}
@media (orientation:landscape){
 body{background:repeating-linear-gradient(90deg,#1f8a3a 0 10vw,#23993f 10vw 20vw)}
 .deco .port{display:none}.deco .land{display:block}
 .grid{flex-direction:row;flex-wrap:wrap}
 .card{flex:1 1 200px;grid-template-columns:1fr;grid-template-areas:"num" "txt" "food";justify-items:center;text-align:center;row-gap:1.5vmin;padding:3vmin 2vmin}
 .card::before{inset:0 0 auto 0;width:auto;height:1.4vmin}
 .card .txt{align-items:center;text-align:center}
 .card .num{font-size:max(50px,11vmin)}.card .lbl{font-size:max(22px,4vmin)}.card .val{font-size:max(24px,4.4vmin)}.card .food{font-size:max(36px,7vmin)}
 .live{right:auto;left:2vmin}
}
</style></head><body>
<div class="deco" aria-hidden="true"><svg class="port" viewBox="0 0 1080 1920" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="6"><rect x="40" y="40" width="1000" height="1840"/><line x1="40" y1="960" x2="1040" y2="960"/><circle cx="540" cy="960" r="150"/><circle cx="540" cy="960" r="8" fill="rgba(255,255,255,.35)"/><rect x="260" y="40" width="560" height="270"/><rect x="400" y="40" width="280" height="90"/><rect x="260" y="1610" width="560" height="270"/><rect x="400" y="1790" width="280" height="90"/><path d="M430 310 A140 140 0 0 0 650 310"/><path d="M430 1610 A140 140 0 0 1 650 1610"/><rect x="460" y="14" width="160" height="26" stroke-width="5"/><rect x="460" y="1880" width="160" height="26" stroke-width="5"/></svg><svg class="land" viewBox="0 0 1920 1080" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="6"><rect x="40" y="40" width="1840" height="1000"/><line x1="960" y1="40" x2="960" y2="1040"/><circle cx="960" cy="540" r="150"/><circle cx="960" cy="540" r="8" fill="rgba(255,255,255,.35)"/><rect x="40" y="260" width="270" height="560"/><rect x="40" y="400" width="90" height="280"/><rect x="1610" y="260" width="270" height="560"/><rect x="1790" y="400" width="90" height="280"/><path d="M310 430 A140 140 0 0 1 310 650"/><path d="M1610 430 A140 140 0 0 0 1610 650"/></svg></div>
<header><h1><span class="ic">⚽</span><span id="title">Fridge board</span></h1><div id="meta"><span id="upd"></span> <span id="err"></span></div></header>
<main id="board"></main>
<footer>⚠️ Public page — do not put sensitive or personal information here.</footer>
<script>
"use strict";
let last=null;
const DAYS={mon:["⚽",1],tue:["🥅",2],wed:["👟",3],thu:["🧤",4],fri:["🏆",5],sat:["🏟️",6],sun:["⚽",7]};
const FOOD=[[/no school|holiday|vacation|vakantie|congé/i,"🏖️"],[/pasta|spaghetti|lasagn|macaroni/i,"🍝"],[/soup|soep|soupe/i,"🍲"],[/pizza/i,"🍕"],[/fish|vis|poisson/i,"🐟"],[/chicken|kip|poulet/i,"🍗"],[/rice|rijst|riz/i,"🍚"],[/fruit|apple|appel/i,"🍉"],[/salad|sla/i,"🥗"],[/burger/i,"🍔"],[/fries|frites|friet/i,"🍟"],[/sandwich|bread|brood/i,"🥪"],[/menu\s*1/i,"🍝"],[/menu\s*2/i,"🍲"],[/menu\s*3/i,"🥗"],[/menu/i,"🍽️"]];
function fmt(s){const d=new Date(s);if(isNaN(d))return String(s||"");
return d.toLocaleString("en-GB",{timeZone:"Europe/Brussels",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}
function el(t,txt,c){const e=document.createElement(t);if(txt!=null)e.textContent=String(txt);if(c)e.className=c;return e;}
function today(){const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Brussels",weekday:"short",day:"numeric"}).formatToParts(new Date());
 const g=k=>(p.find(x=>x.type===k)||{}).value||"";return {wd:g("weekday").slice(0,3).toLowerCase(),d:g("day")};}
function card(item,i,t){
 const s=typeof item==="string"?item:JSON.stringify(item);
 const m=s.match(/^\s*([A-Za-z]{3})[a-z]*\.?\s*(\d{1,2})?[^:]*:\s*(.*)$/);
 const c=el("div",null,"card c"+(i%7));
 const key=m?m[1].toLowerCase():"";const dy=DAYS[key];
 const jn=el("div",null,"jn");jn.appendChild(el("div",dy?String(dy[1]):String(i+1),"num"));jn.appendChild(el("div",dy?dy[0]:"⚽","day"));c.appendChild(jn);
 const tx=el("div",null,"txt");
 const val=m?m[3]:s;
 if(m)tx.appendChild(el("div",s.slice(0,s.indexOf(":")).trim(),"lbl"));
 if(/no school/i.test(val)){const v=el("div",null,"val");v.appendChild(el("span","😎 REST DAY · "+val,"badge"));tx.appendChild(v);}
 else tx.appendChild(el("div",val,"val"));
 c.appendChild(tx);
 const blank=!val.trim()||/^[—–-]+$/.test(val.trim());
 let f=blank?"":"🍱";for(const [re,e] of FOOD){if(re.test(val)){f=e;break;}}
 if(f)c.appendChild(el("div",f,"food"));
 if(dy&&key===t.wd&&(!m[2]||m[2]===t.d)){c.classList.add("today");const l=el("div",null,"live");l.appendChild(el("i"));l.appendChild(el("span","LIVE"));c.appendChild(l);}
 return c;}
function render(b){
 document.getElementById("title").textContent=b.title||"Fridge board";
 document.title=b.title||"Fridge board";
 document.getElementById("upd").textContent=b.updated?"⏱ UPDATED "+fmt(b.updated):"";
 const m=document.getElementById("board");m.replaceChildren();const t=today();
 (Array.isArray(b.sections)?b.sections:[]).forEach(s=>{
  m.appendChild(el("h2",s&&s.heading||""));
  const g=el("div",null,"grid");(Array.isArray(s&&s.items)?s.items:[]).forEach((it,i)=>g.appendChild(card(it,i,t)));
  m.appendChild(g);});
}
async function tick(){
 try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error(r.status);const txt=await r.text();
  document.getElementById("err").textContent="";
  if(txt!==last){render(JSON.parse(txt));last=txt;}
 }catch(e){document.getElementById("err").textContent="(offline, retrying)";}
}
tick();setInterval(tick,10000);
setInterval(()=>{last=null;},3600000);
</script></body></html>
