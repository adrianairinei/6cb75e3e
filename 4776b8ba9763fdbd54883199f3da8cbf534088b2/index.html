<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Fridge board</title>
<style>
html,body{margin:0;height:100%;background:#fff;color:#111;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{padding:4vmin 5vmin 2vmin}
h1{margin:0;font-size:max(40px,7vmin);font-weight:600}
#upd{font-size:max(20px,3vmin);color:#555}
main{flex:1;padding:2vmin 5vmin 14vmin;overflow:auto}
section{margin-bottom:4vmin}
h2{margin:0 0 2vmin;font-size:max(30px,5vmin);font-weight:600}
ul{margin:0;padding:0;list-style:none}
li{font-size:max(32px,6vmin);padding:2vmin 0;border-bottom:1px solid #ddd;line-height:1.3;min-height:1.3em}
li:last-child{border-bottom:0}
footer{position:fixed;left:0;right:0;bottom:0;padding:2vmin 4vmin;background:#f2f2f2;color:#333;border-top:1px solid #ccc;font-size:max(18px,2.6vmin);text-align:center}
#err{color:#b00;font-size:max(18px,2.6vmin)}
</style></head><body>
<header><h1 id="title">Fridge board</h1><div><span id="upd"></span> <span id="err"></span></div></header>
<main id="board"></main>
<footer>Public page — do not put sensitive or personal information here.</footer>
<script>
"use strict";
let last=null;
function fmt(s){const d=new Date(s);if(isNaN(d))return String(s||"");
return d.toLocaleString("en-GB",{timeZone:"Europe/Brussels",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}
function el(t,txt){const e=document.createElement(t);if(txt!=null)e.textContent=String(txt);return e;}
function render(b){
 document.getElementById("title").textContent=b.title||"Fridge board";
 document.title=b.title||"Fridge board";
 document.getElementById("upd").textContent=b.updated?"Updated "+fmt(b.updated):"";
 const m=document.getElementById("board");m.replaceChildren();
 (Array.isArray(b.sections)?b.sections:[]).forEach(s=>{
  const sec=el("section");sec.appendChild(el("h2",s&&s.heading||""));
  const ul=el("ul");(Array.isArray(s&&s.items)?s.items:[]).forEach(i=>ul.appendChild(el("li",typeof i==="string"?i:JSON.stringify(i))));
  sec.appendChild(ul);m.appendChild(sec);});
}
async function tick(){
 try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error(r.status);const txt=await r.text();
  document.getElementById("err").textContent="";
  if(txt!==last){render(JSON.parse(txt));last=txt;}
 }catch(e){document.getElementById("err").textContent="(offline, retrying)";}
}
tick();setInterval(tick,10000);
</script></body></html>
